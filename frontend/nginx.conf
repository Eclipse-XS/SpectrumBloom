server {
    listen 8501;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # FastAPI enforces the exact MAX_UPLOAD_MB limit (default 25 MB, max 250 MB)
    # via streaming chunked reads; allow up to 256M at the reverse proxy so
    # multipart uploads up to the maximum configured FastAPI limit return a structured JSON error.
    client_max_body_size 256M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Authorization;
        proxy_connect_timeout 10s;
        proxy_read_timeout 240s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

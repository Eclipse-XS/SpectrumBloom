services:
  sandbox-image:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: spectrumbloom-sandbox:latest
    command: ["true"]
    restart: "no"

  sandbox-executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
    container_name: spectrumbloom-sandbox-executor
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    environment:
      SANDBOX_DOCKER_IMAGE: spectrumbloom-sandbox:latest
      SANDBOX_EXECUTOR_TOKEN: ${SANDBOX_EXECUTOR_TOKEN:?Set SANDBOX_EXECUTOR_TOKEN (>=16 random chars) in .env before running Docker Compose}
    volumes:
      # Isolated internal execution boundary only; never mounted into the API or UI containers.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sandbox_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spectrumbloom-api
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.example
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?Set API_AUTH_TOKEN (>=16 random chars) in .env before running Docker Compose}
      SANDBOX_BACKEND: ${COMPOSE_SANDBOX_BACKEND:-remote}
      SANDBOX_EXECUTOR_URL: http://sandbox-executor:9100
      SANDBOX_EXECUTOR_TOKEN: ${SANDBOX_EXECUTOR_TOKEN:?Set SANDBOX_EXECUTOR_TOKEN (>=16 random chars) in .env before running Docker Compose}
      OLLAMA_BASE_URL: ${COMPOSE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLAMACPP_BASE_URL: ${COMPOSE_LLAMACPP_BASE_URL:-http://host.docker.internal:8080/v1}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct}
      REDIS_URL: ${REDIS_URL:-}
      LOCAL_DATASET_DIR: /app/data/datasets
      CORS_ALLOW_ORIGINS: http://localhost:8501,http://127.0.0.1:8501,http://localhost:4200,http://127.0.0.1:4200
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - spectrumbloom_datasets:/app/data/datasets
    depends_on:
      sandbox-executor:
        condition: service_healthy
    networks:
      - app_net
      - sandbox_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spectrumbloom-frontend
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8501/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spectrumbloom-legacy-ui
    profiles: ["legacy-ui"]
    ports:
      - "127.0.0.1:8502:8501"
    environment:
      SPECTRUMBLOOM_API_URL: http://api:8000
      SPECTRUMBLOOM_DEFAULT_API_TOKEN: ${API_AUTH_TOKEN:?Set API_AUTH_TOKEN (>=16 random chars) in .env before running Docker Compose}
    command:
      [
        "streamlit",
        "run",
        "src/spectrumbloom/ui/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true"
      ]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: spectrumbloom-redis
    profiles: ["persistence"]
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - spectrumbloom_redis:/data
    networks:
      - app_net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: spectrumbloom-ollama
    profiles: ["local-llm"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - spectrumbloom_ollama:/root/.ollama
    networks:
      - app_net
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: spectrumbloom-jaeger
    profiles: ["observability"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    networks:
      - app_net
    restart: unless-stopped

networks:
  app_net:
    driver: bridge
  sandbox_internal:
    driver: bridge
    internal: true

volumes:
  spectrumbloom_datasets:
  spectrumbloom_redis:
  spectrumbloom_ollama:

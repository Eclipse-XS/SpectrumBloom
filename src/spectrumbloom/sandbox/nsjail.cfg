# Optional nsjail configuration for Linux kernel-level isolation.
# Never runs the API container as privileged; requires user-namespace support.

name: "spectrumbloom_sandbox"
description: "Unprivileged networkless nsjail sandbox for LLM-generated EDA code"

mode: ONCE
hostname: "sb-sandbox"

time_limit: 20
rlimit_as_type: HARD
rlimit_as: 1024
rlimit_cpu_type: HARD
rlimit_cpu: 20
rlimit_fsize_type: HARD
rlimit_fsize: 4
rlimit_nofile_type: HARD
rlimit_nofile: 64
max_cpus: 1

clone_newnet: true
clone_newpid: true
clone_newuser: true
clone_newns: true
clone_newipc: true
clone_newuts: true

mount { src: "/usr" dst: "/usr" is_bind: true rw: false }
mount { src: "/lib" dst: "/lib" is_bind: true rw: false }
mount { src: "/lib64" dst: "/lib64" is_bind: true rw: false mandatory: false }
mount { src: "/bin" dst: "/bin" is_bind: true rw: false }
mount { src: "/usr/local" dst: "/usr/local" is_bind: true rw: false }
mount { fstype: "proc" dst: "/proc" }
mount { fstype: "tmpfs" dst: "/dev" rw: false }
mount { fstype: "tmpfs" dst: "/tmp" rw: true options: "size=8388608" }

cwd: "/sandbox"
log_level: 3
